<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Internal Links Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        button.delete-btn { background: #dc3545; padding: 5px 10px; font-size: 12px; }
        
        /* 普通链接样式 */
        .link-item { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        
        /* 重要链接样式：加粗蓝色边框和浅蓝背景 */
        .link-item.important {
            border: 2px solid #007bff;
            background-color: #f8fbff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .link-info h3 { margin: 0 0 5px 0; }
        .link-info a { color: #007bff; text-decoration: none; }
        .meta-data { font-size: 12px; color: #666; margin-top: 5px; }
        #searchBox { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border: 2px solid #007bff; }
    </style>
</head>
<body>

    <h2>🔗 NBT Company System / Link Directory</h2>

    <div class="card">
        <input type="text" id="searchBox" placeholder="🔍 Type a name to search..." oninput="filterLinks()">
    </div>

    <!-- 已经移除了底部的勾选框，界面清爽干净 -->
    <div class="card">
        <h3>➕ Add New Link</h3>
        <input type="text" id="linkName" placeholder="System Name (e.g., HR Portal)" required>
        <input type="url" id="linkUrl" placeholder="https://..." required>
        <input type="text" id="userName" placeholder="Your Name" required>
        <br>
        <button onclick="addLink()">Add Link</button>
    </div>

    <div class="card" id="linksContainer">
        <p>Loading...</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://yvtujoueyotncbvdlgyf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_98O37WT0nSZVw2I9128JOg___CX38Dn';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLinks = [];

        async function fetchLinks() {
            const { data, error } = await supabaseClient
                .from('company_links')
                .select('*')
                .order('priority', { ascending: false })
                .order('name', { ascending: true });

            if (error) {
                console.error("Fetch error:", error);
                document.getElementById('linksContainer').innerHTML = `<p style="color:red;">Error loading data: ${error.message}</p>`;
                return;
            }
            allLinks = data;
            renderLinks(allLinks);
        }

        function renderLinks(links) {
            const container = document.getElementById('linksContainer');
            container.innerHTML = ''; 

            if (links.length === 0) {
                container.innerHTML = '<p>No data available yet.</p>';
                return;
            }

            links.forEach(link => {
                const date = new Date(link.created_at).toLocaleString('en-US');
                const div = document.createElement('div');
                
                const isImportant = link.priority > 0;
                div.className = isImportant ? 'link-item important' : 'link-item';

                div.innerHTML = `
                    <div class="link-info">
                        <h3>${link.name}</h3>
                        <a href="${link.url}" target="_blank">${link.url}</a>
                        <div class="meta-data">👤 Added by: <b>${link.created_by}</b> | 🕒 Time: ${date}</div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button style="background: ${link.priority > 0 ? '#6c757d' : '#ffc107'}; color: ${link.priority > 0 ? 'white' : 'black'}; padding: 5px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer;" onclick="toggleImportant('${link.id}', ${link.priority})">
                            ${link.priority > 0 ? 'Unpin' : '⭐ Pin'}
                        </button>
                        <button class="delete-btn" onclick="deleteLink('${link.id}')">Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterLinks() {
            const keyword = document.getElementById('searchBox').value.toLowerCase();
            const filtered = allLinks.filter(link => 
                link.name.toLowerCase().includes(keyword)
            );
            renderLinks(filtered);
        }

        async function addLink() {
            const name = document.getElementById('linkName').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const user = document.getElementById('userName').value.trim();
            
            // 默认新添加的优先级为 0（普通）
            const priority = 0;

            if (!name || !url || !user) {
                alert("Please fill in all fields!");
                return;
            }

            const { error } = await supabaseClient
                .from('company_links')
                .insert([{ name: name, url: url, created_by: user, priority: priority }]);

            if (error) {
                alert("Failed to add: " + error.message);
            } else {
                document.getElementById('linkName').value = '';
                document.getElementById('linkUrl').value = '';
                document.getElementById('userName').value = '';
                fetchLinks(); 
            }
        }

        // 切换重要/置顶状态的函数
        async function toggleImportant(id, currentPriority) {
            const newPriority = currentPriority > 0 ? 0 : 10;

            const { error } = await supabaseClient
                .from('company_links')
                .update({ priority: newPriority })
                .eq('id', id);

            if (error) {
                alert("Failed to update: " + error.message);
            } else {
                fetchLinks(); 
            }
        }

        async function deleteLink(id) {
            if (!confirm("Are you sure you want to delete this link?")) return;

            const { error } = await supabaseClient
                .from('company_links')
                .delete()
                .eq('id', id);

            if (error) {
                alert("Failed to delete: " + error.message);
            } else {
                fetchLinks(); 
            }
        }

        window.onload = fetchLinks;
    </script>
</body>
</html>
